<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heo Đất Tiết Kiệm - Đăng Nhập</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-summary {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            border-radius: 15px;
        }
        .history-item {
            transition: all 0.2s;
        }
        .history-item:hover {
            background-color: #f1f3f5;
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
</head>
<body>

    <div class="container py-4">
        <h2 class="text-center mb-3 fw-bold text-primary"><i class="fa-solid fa-piggy-bank"></i> Quản Lý Tiền Để Dành</h2>

        <!-- Nút tải ứng dụng PWA -->
        <div id="installContainer" class="text-center mb-3 d-none">
            <button id="btnInstall" class="btn btn-warning fw-bold text-dark px-4 py-2 rounded-pill shadow-sm">
                <i class="fa-solid fa-download me-2"></i> Tải Ứng Dụng Về Máy
            </button>
        </div>

        <!-- KHU VỰC 1: FORM ĐĂNG NHẬP / ĐĂNG KÝ (Hiển thị khi chưa đăng nhập) -->
        <div id="authSection" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4 border-0 rounded-4">
                    <h4 class="text-center mb-3 text-secondary" id="authTitle">Đăng Nhập Tài Khoản</h4>
                    
                    <form id="authForm">
                        <div class="mb-3">
                            <label for="userEmail" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="userEmail" placeholder="vd: nam@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="userPassword" class="form-label">Mật khẩu:</label>
                            <input type="password" class="form-control" id="userPassword" placeholder="********" required>
                        </div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="button" id="authActionBtn" onclick="handleAuth()" class="btn btn-primary fw-bold py-2">
                                <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập
                            </button>
                        </div>

                        <div class="text-center">
                            <span id="authToggleText" class="text-muted">Chưa có tài khoản?</span>
                            <a href="#" onclick="toggleAuthMode(event)" id="authToggleLink" class="text-decoration-none fw-bold">Đăng ký ngay</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- KHU VỰC 2: ỨNG DỤNG CHÍNH (Ẩn đi cho đến khi đăng nhập thành công) -->
        <div id="appSection" class="d-none">
            <!-- Thông tin tài khoản & Nút Đăng xuất -->
            <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-3 rounded-4 shadow-sm">
                <div>
                    <span class="text-muted">Xin chào, </span>
                    <strong id="userDisplayEmail" class="text-primary"></strong>
                </div>
                <button onclick="logout()" class="btn btn-outline-secondary btn-sm fw-bold">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất
                </button>
            </div>

            <!-- Thanh Menu chuyển đổi tab -->
            <ul class="nav nav-pills justify-content-center mb-4 gap-2">
                <li class="nav-item">
                    <button class="nav-link active fw-bold px-4 rounded-pill shadow-sm" id="tabHomeBtn" onclick="switchTab('home')">
                        <i class="fa-solid fa-house me-1"></i> Giao Dịch
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link fw-bold px-4 rounded-pill shadow-sm text-dark bg-white border" id="tabHistoryBtn" onclick="switchTab('history')">
                        <i class="fa-solid fa-clock-rotate-left me-1"></i> Xem Lịch Sử
                    </button>
                </li>
            </ul>

            <div class="row justify-content-center">
                <!-- Tổng số tiền -->
                <div class="col-md-8 mb-4">
                    <div class="card card-summary shadow-sm p-4 text-center">
                        <h5>Số Tiền Tiết Kiệm Hiện Tại</h5>
                        <h1 id="totalBalance" class="display-4 fw-bold my-2">0 đ</h1>
                        <p class="mb-0 opacity-75">Cố gắng tích lũy mỗi ngày nhé!</p>
                    </div>
                </div>

                <!-- TAB 1: Khu vực Nhập Tiền -->
                <div class="col-md-8 mb-4 tab-content-item" id="sectionHome">
                    <div class="card shadow-sm p-4 border-0 rounded-4">
                        <h5 class="mb-3">Thực Hiện Giao Dịch</h5>
                        <form id="moneyForm">
                            <div class="mb-3">
                                <label for="amount" class="form-label">Nhập số tiền (VNĐ):</label>
                                <input type="number" class="form-control form-control-lg" id="amount" placeholder="VD: 50000" min="10000" step="1000" required>
                                <div class="form-text">Số tiền tối thiểu là 10.000 đ</div>
                            </div>

                            <div class="mb-3">
                                <label for="note" class="form-label">Ghi chú (Tùy chọn):</label>
                                <input type="text" class="form-control" id="note" placeholder="VD: Tiền ống heo, Lương tháng này...">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="button" onclick="addMoney('deposit')" class="btn btn-success flex-fill py-2 fw-bold">
                                    <i class="fa-solid fa-plus-circle"></i> Thêm Tiền
                                </button>
                                <button type="button" onclick="addMoney('withdraw')" class="btn btn-danger flex-fill py-2 fw-bold">
                                    <i class="fa-solid fa-minus-circle"></i> Rút Tiền
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- TAB 2: Khu vực Lịch Sử Riêng Biệt -->
                <div class="col-md-8 mb-4 tab-content-item d-none" id="sectionHistory">
                    <div class="card shadow-sm p-4 border-0 rounded-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Lịch Sử Giao Dịch</h5>
                            <button onclick="clearHistory()" class="btn btn-outline-danger btn-sm">Xóa Tất Cả</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Thời gian</th>
                                        <th>Ghi chú</th>
                                        <th class="text-end">Số tiền</th>
                                        <th class="text-center">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="historyList">
                                    <!-- Dữ liệu lịch sử sẽ render ở đây -->
                                </tbody>
                            </table>
                        </div>
                        <p id="emptyMessage" class="text-center text-muted mt-3 d-none">Chưa có lịch sử giao dịch nào.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript xử lý giao diện & tạm thời mô phỏng logic đăng nhập -->
    <script>
        let isLoginMode = true; // Trạng thái: true là Đăng nhập, false là Đăng ký
        let currentUser = localStorage.getItem('currentUser') || null;
        let transactions = JSON.parse(localStorage.getItem('transactions_' + currentUser)) || [];

        // Kiểm tra trạng thái đăng nhập khi load trang
        function checkAuthState() {
            if (currentUser) {
                document.getElementById('authSection').classList.add('d-none');
                document.getElementById('appSection').classList.remove('d-none');
                document.getElementById('userDisplayEmail').textContent = currentUser;
                transactions = JSON.parse(localStorage.getItem('transactions_' + currentUser)) || [];
                updateUI();
            } else {
                document.getElementById('authSection').classList.remove('d-none');
                document.getElementById('appSection').classList.add('d-none');
            }
        }

        // Chuyển đổi qua lại giữa form Đăng nhập và Đăng ký
        function toggleAuthMode(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            const titleEl = document.getElementById('authTitle');
            const btnEl = document.getElementById('authActionBtn');
            const toggleTextEl = document.getElementById('authToggleText');
            const toggleLinkEl = document.getElementById('authToggleLink');

            if (isLoginMode) {
                titleEl.textContent = "Đăng Nhập Tài Khoản";
                btnEl.innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập';
                toggleTextEl.textContent = "Chưa có tài khoản?";
                toggleLinkEl.textContent = "Đăng ký ngay";
            } else {
                titleEl.textContent = "Đăng Ký Tài Khoản Mới";
                btnEl.innerHTML = '<i class="fa-solid fa-user-plus me-1"></i> Đăng Ký';
                toggleTextEl.textContent = "Đã có tài khoản?";
                toggleLinkEl.textContent = "Đăng nhập ngay";
            }
        }

        // Xử lý nút Đăng nhập / Đăng ký (Sau này sẽ thay bằng Firebase Auth)
        function handleAuth() {
            const email = document.getElementById('userEmail').value.trim();
            const pass = document.getElementById('userPassword').value.trim();

            if (!email || !pass) {
                alert('Vui lòng nhập đầy đủ Email và Mật khẩu!');
                return;
            }

            if (isLoginMode) {
                // Xử lý Đăng nhập tạm thời
                currentUser = email;
                localStorage.setItem('currentUser', currentUser);
                alert('Đăng nhập thành công!');
            } else {
                // Xử lý Đăng ký tạm thời
                currentUser = email;
                localStorage.setItem('currentUser', currentUser);
                alert('Đăng ký tài khoản thành công!');
            }

            document.getElementById('userEmail').value = '';
            document.getElementById('userPassword').value = '';
            checkAuthState();
        }

        // Đăng xuất
        function logout() {
            if (confirm('Bạn có muốn đăng xuất khỏi tài khoản không?')) {
                localStorage.removeItem('currentUser');
                currentUser = null;
                checkAuthState();
            }
        }

        function formatCurrency(number) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(number);
        }

        // Chuyển đổi tab trong ứng dụng
        function switchTab(tabName) {
            const homeSec = document.getElementById('sectionHome');
            const historySec = document.getElementById('sectionHistory');
            const homeBtn = document.getElementById('tabHomeBtn');
            const historyBtn = document.getElementById('tabHistoryBtn');

            if (tabName === 'home') {
                homeSec.classList.remove('d-none');
                historySec.classList.add('d-none');
                homeBtn.className = 'nav-link active fw-bold px-4 rounded-pill shadow-sm';
                historyBtn.className = 'nav-link fw-bold px-4 rounded-pill shadow-sm text-dark bg-white border';
            } else {
                homeSec.classList.add('d-none');
                historySec.classList.remove('d-none');
                historyBtn.className = 'nav-link active fw-bold px-4 rounded-pill shadow-sm';
                homeBtn.className = 'nav-link fw-bold px-4 rounded-pill shadow-sm text-dark bg-white border';
            }
        }

        function updateUI() {
            if (!currentUser) return;
            const totalBalanceEl = document.getElementById('totalBalance');
            const historyListEl = document.getElementById('historyList');
            const emptyMessageEl = document.getElementById('emptyMessage');

            let total = transactions.reduce((acc, item) => {
                return item.type === 'deposit' ? acc + item.amount : acc - item.amount;
            }, 0);

            totalBalanceEl.textContent = formatCurrency(total);

            historyListEl.innerHTML = '';
            if (transactions.length === 0) {
                emptyMessageEl.classList.remove('d-none');
            } else {
                emptyMessageEl.classList.add('d-none');
                [...transactions].reverse().forEach((item, index) => {
                    const originalIndex = transactions.length - 1 - index;
                    
                    const row = document.createElement('tr');
                    row.className = 'history-item';
                    
                    const isDeposit = item.type === 'deposit';
                    const amountClass = isDeposit ? 'text-success fw-bold' : 'text-danger fw-bold';
                    const amountSign = isDeposit ? '+' : '-';

                    row.innerHTML = `
                        <td><small class="text-muted">${item.date}</small></td>
                        <td>${item.note || (isDeposit ? 'Thêm tiền' : 'Rút tiền')}</td>
                        <td class="text-end ${amountClass}">${amountSign}${formatCurrency(item.amount)}</td>
                        <td class="text-center">
                            <button onclick="deleteItem(${originalIndex})" class="btn btn-sm text-danger"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    historyListEl.appendChild(row);
                });
            }

            localStorage.setItem('transactions_' + currentUser, JSON.stringify(transactions));
        }

        function addMoney(type) {
            const amountInput = document.getElementById('amount');
            const noteInput = document.getElementById('note');
            
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount < 10000) {
                alert('Vui lòng nhập số tiền hợp lệ (Tối thiểu 10.000 đ)!');
                amountInput.focus();
                return;
            }

            if (type === 'withdraw') {
                let currentTotal = transactions.reduce((acc, item) => {
                    return item.type === 'deposit' ? acc + item.amount : acc - item.amount;
                }, 0);

                if (amount > currentTotal) {
                    alert('Số dư trong heo không đủ để rút số tiền này!');
                    return;
                }
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN');

            const newTransaction = {
                type: type,
                amount: amount,
                note: noteInput.value.trim(),
                date: dateStr
            };

            transactions.push(newTransaction);
            amountInput.value = '';
            noteInput.value = '';
            updateUI();
            switchTab('history');
        }

        function deleteItem(index) {
            if (confirm('Bạn có chắc muốn xóa giao dịch này không?')) {
                transactions.splice(index, 1);
                updateUI();
            }
        }

        function clearHistory() {
            if (confirm('Bạn có chắc muốn xóa toàn bộ lịch sử và làm lại từ đầu không?')) {
                transactions = [];
                updateUI();
            }
        }

        // Chạy kiểm tra đăng nhập lúc đầu
        checkAuthState();

        // Xử lý sự kiện PWA Install
        let deferredPrompt;
        const installContainer = document.getElementById('installContainer');
        const btnInstall = document.getElementById('btnInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installContainer.classList.remove('d-none');
        });

        btnInstall.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('Người dùng đã chấp nhận cài đặt');
            }
            deferredPrompt = null;
            installContainer.classList.add('d-none');
        });

        window.addEventListener('appinstalled', () => {
            installContainer.classList.add('d-none');
            alert('Ứng dụng đã được cài đặt thành công!');
        });
    </script>
</body>
</html>
