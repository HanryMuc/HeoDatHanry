<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heo Đất Tiết Kiệm Thông Minh</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .piggy-card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .history-item:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <!-- Khu vực Đăng nhập / Bắt đầu -->
        <div id="auth-section" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card piggy-card p-4">
                    <h3 class="text-center text-primary mb-4"><i class="fa-solid fa-piggy-bank me-2"></i>Heo Đất Tiết Kiệm</h3>
                    <div class="mb-3">
                        <label for="username" class="form-label">Tên tài khoản</label>
                        <input type="text" class="form-control" id="username" placeholder="Nhập tên của bạn...">
                    </div>
                    <div class="d-grid gap-2">
                        <button onclick="handleLogin()" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket me-1"></i> Đăng nhập / Bắt đầu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Khu vực Ứng dụng chính (Ẩn khi chưa đăng nhập) -->
        <div id="app-section" class="d-none">
            <!-- Header chào hỏi & Đăng xuất -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4>Xin chào, <span id="user-display" class="text-primary fw-bold"></span>! 👋</h4>
                <button onclick="handleLogout()" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất</button>
            </div>

            <div class="row">
                <!-- Cột trái: Số dư & Form giao dịch -->
                <div class="col-md-4 mb-4">
                    <!-- Thẻ hiển thị tổng tiền -->
                    <div class="card piggy-card bg-primary text-white p-4 mb-4 text-center">
                        <h5 class="card-title mb-2"><i class="fa-solid fa-wallet me-2"></i>Tổng số dư trong heo</h5>
                        <h2 id="total-balance" class="fw-bold mb-0">0 đ</h2>
                    </div>

                    <!-- Form Thêm/Rút tiền -->
                    <div class="card piggy-card p-4">
                        <h5 class="mb-3"><i class="fa-solid fa-coins me-2"></i>Giao dịch</h5>
                        <div class="mb-3">
                            <label for="amount" class="form-label">Số tiền (VNĐ)</label>
                            <input type="number" class="form-control" id="amount" placeholder="VD: 50000">
                        </div>
                        <div class="mb-3">
                            <label for="note" class="form-label">Ghi chú</label>
                            <input type="text" class="form-control" id="note" placeholder="VD: Tiền ống heo ăn sáng...">
                        </div>
                        <div class="d-grid gap-2">
                            <button onclick="addMoney('deposit')" class="btn btn-success"><i class="fa-solid fa-plus me-1"></i> Bỏ ống heo (Nạp)</button>
                            <button onclick="addMoney('withdraw')" class="btn btn-danger"><i class="fa-solid fa-minus me-1"></i> Đập heo (Rút)</button>
                        </div>
                    </div>
                </div>

                <!-- Cột phải: Lịch sử giao dịch -->
                <div class="col-md-8">
                    <div class="card piggy-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0"><i class="fa-solid fa-clock-rotate-left me-2"></i>Lịch sử giao dịch</h5>
                            <button onclick="clearHistory()" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash-can me-1"></i> Xóa tất cả</button>
                        </div>

                        <!-- Danh sách giao dịch -->
                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            <table class="table table-hover align-middle">
                                <tbody id="history-list">
                                    <!-- Dữ liệu được render bằng JS -->
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-message" class="text-center text-muted py-4 d-none">
                            <i class="fa-solid fa-box-open fa-2x mb-2"></i>
                            <p>Chưa có giao dịch nào được ghi nhận.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = localStorage.getItem('current_user') || '';
        let transactions = [];

        // Định dạng tiền tệ VNĐ
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        // Kiểm tra trạng thái đăng nhập khi load trang
        function checkAuthState() {
            if (currentUser) {
                document.getElementById('auth-section').classList.add('d-none');
                document.getElementById('app-section').classList.remove('d-none');
                document.getElementById('user-display').innerText = currentUser;
                
                // Tải dữ liệu giao dịch của user này
                const savedData = localStorage.getItem('transactions_' + currentUser);
                transactions = savedData ? JSON.parse(savedData) : [];
                updateUI();
            } else {
                document.getElementById('auth-section').classList.remove('d-none');
                document.getElementById('app-section').classList.add('d-none');
            }
        }

        // Xử lý đăng nhập
        function handleLogin() {
            const usernameInput = document.getElementById('username');
            const name = usernameInput.value.trim();
            if (!name) {
                alert('Vui lòng nhập tên tài khoản của bạn!');
                usernameInput.focus();
                return;
            }
            currentUser = name;
            localStorage.setItem('current_user', currentUser);
            usernameInput.value = '';
            checkAuthState();
        }

        // Đăng xuất
        function handleLogout() {
            localStorage.removeItem('current_user');
            currentUser = '';
            transactions = [];
            checkAuthState();
        }

        // Cập nhật toàn bộ giao diện (Số dư & Bảng lịch sử)
        function updateUI() {
            // 1. Tính tổng số dư
            let totalBalance = transactions.reduce((acc, item) => {
                return item.type === 'deposit' ? acc + item.amount : acc - item.amount;
            }, 0);
            document.getElementById('total-balance').innerText = formatCurrency(totalBalance);

            // 2. Hiển thị danh sách lịch sử
            const historyListEl = document.getElementById('history-list');
            const emptyMessageEl = document.getElementById('empty-message');
            historyListEl.innerHTML = '';

            if (transactions.length === 0) {
                emptyMessageEl.classList.remove('d-none');
            } else {
                emptyMessageEl.classList.add('d-none');
                [...transactions].reverse().forEach((item, index) => {
                    const originalIndex = transactions.length - 1 - index;
                    const row = document.createElement('tr');
                    row.className = 'history-item';
                    const isDeposit = item.type === 'deposit';
                    const amountClass = isDeposit ? 'text-success fw-bold' : 'text-danger fw-bold';
                    const amountSign = isDeposit ? '+' : '-';

                    row.innerHTML = `
                        <td><small class="text-muted">${item.date}</small></td>
                        <td>${item.note || (isDeposit ? 'Thêm tiền' : 'Rút tiền')}</td>
                        <td class="text-end ${amountClass}">${amountSign}${formatCurrency(item.amount)}</td>
                        <td class="text-center">
                            <button onclick="deleteItem(${originalIndex})" class="btn btn-sm text-danger" title="Xóa giao dịch"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    historyListEl.appendChild(row);
                });
            }

            // 3. Lưu vào LocalStorage theo từng user
            localStorage.setItem('transactions_' + currentUser, JSON.stringify(transactions));
        }

        // Thêm hoặc Rút tiền
        function addMoney(type) {
            const amountInput = document.getElementById('amount');
            const noteInput = document.getElementById('note');
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0) {
                alert('Vui lòng nhập số tiền hợp lệ lớn hơn 0!');
                amountInput.focus();
                return;
            }

            if (type === 'withdraw') {
                let currentTotal = transactions.reduce((acc, item) => {
                    return item.type === 'deposit' ? acc + item.amount : acc - item.amount;
                }, 0);

                if (amount > currentTotal) {
                    alert('Số dư trong heo không đủ để rút số tiền này!');
                    return;
                }
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN');

            const newTransaction = {
                type: type,
                amount: amount,
                note: noteInput.value.trim(),
                date: dateStr
            };

            transactions.push(newTransaction);
            amountInput.value = '';
            noteInput.value = '';
            updateUI();
        }

        // Xóa 1 giao dịch
        function deleteItem(index) {
            if (confirm('Bạn có chắc muốn xóa giao dịch này không?')) {
                transactions.splice(index, 1);
                updateUI();
            }
        }

        // Xóa toàn bộ lịch sử
        function clearHistory() {
            if (confirm('Bạn có chắc muốn xóa toàn bộ lịch sử và làm lại từ đầu không?')) {
                transactions = [];
                updateUI();
            }
        }

        // Khởi chạy hệ thống khi tải trang
        checkAuthState();
    </script>
</body>
</html>
