<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký Hệ Thống</title>
    <!-- Thêm Bootstrap để giao diện đẹp mắt -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 400px;" id="auth-container">
        <!-- FORM ĐĂNG NHẬP -->
        <div id="login-section">
            <h3 class="text-center mb-3">Đăng Nhập Hệ Thống</h3>
            <form id="form-dang-nhap">
                <div class="mb-3">
                    <label class="form-label">Tên tài khoản</label>
                    <input type="text" class="form-control" id="login-username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng Nhập</button>
            </form>
            <div class="text-center mt-3">
                <small>Chưa có tài khoản? <a href="#" id="to-register">Đăng ký ngay</a></small>
            </div>
        </div>

        <!-- FORM ĐĂNG KÝ (Ẩn ban đầu) -->
        <div id="register-section" class="d-none">
            <h3 class="text-center mb-3">Đăng Ký Tài Khoản</h3>
            <form id="form-dang-ky">
                <div class="mb-3">
                    <label class="form-label">Tên tài khoản</label>
                    <input type="text" class="form-control" id="reg-username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="reg-password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Đăng Ký</button>
            </form>
            <div class="text-center mt-3">
                <small>Đã có tài khoản? <a href="#" id="to-login">Đăng nhập ngay</a></small>
            </div>
        </div>
        
        <!-- KHU VỰC SAU KHI ĐĂNG NHẬP THÀNH CÔNG (Ẩn ban đầu) -->
        <div id="dashboard-section" class="d-none text-center">
            <h3>Chào mừng, <span id="welcome-user"></span>!</h3>
            <p class="text-success">Bạn đã đăng nhập thành công vào hệ thống.</p>
            <button class="btn btn-danger w-100 mt-3" id="btn-logout">Đăng Xuất</button>
        </div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ -->
    <script>
        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');
        const dashboardSection = document.getElementById('dashboard-section');
        
        // Chuyển đổi qua lại giữa form Đăng nhập và Đăng ký
        document.getElementById('to-register').addEventListener('click', (e) => {
            e.preventDefault();
            loginSection.classList.add('d-none');
            registerSection.classList.remove('d-none');
        });

        document.getElementById('to-login').addEventListener('click', (e) => {
            e.preventDefault();
            registerSection.classList.add('d-none');
            loginSection.classList.remove('d-none');
        });

        // Xử lý Đăng ký
        document.getElementById('form-dang-ky').addEventListener('submit', function(e) {
            e.preventDefault();
            let user = document.getElementById('reg-username').value.trim();
            let pass = document.getElementById('reg-password').value.trim();

            let users = JSON.parse(localStorage.getItem('listUsers')) || [];

            // Kiểm tra trùng tên tài khoản
            let existing = users.find(u => u.username === user);
            if (existing) {
                alert('Tên tài khoản này đã tồn tại!');
                return;
            }

            // Lưu tài khoản mới
            users.push({ username: user, password: pass });
            localStorage.setItem('listUsers', JSON.stringify(users));

            alert('Đăng ký thành công! Hãy đăng nhập lại.');
            registerSection.classList.add('d-none');
            loginSection.classList.remove('d-none');
        });

        // Xử lý Đăng nhập
        document.getElementById('form-dang-nhap').addEventListener('submit', function(e) {
            e.preventDefault();
            let user = document.getElementById('login-username').value.trim();
            let pass = document.getElementById('login-password').value.trim();

            let users = JSON.parse(localStorage.getItem('listUsers')) || [];

            // Kiểm tra tài khoản trong LocalStorage hoặc tài khoản mẫu mặc định (Hanry / 123)
            let validUser = users.find(u => u.username === user && u.password === pass);

            if (validUser || (user === 'Hanry' && pass === '123')) {
                // Hiển thị giao diện Dashboard
                loginSection.classList.add('d-none');
                dashboardSection.classList.remove('d-none');
                document.getElementById('welcome-user').innerText = user;
                
                // Lưu trạng thái đang đăng nhập
                localStorage.setItem('currentUser', user);
            } else {
                alert('Sai tên tài khoản hoặc mật khẩu!');
            }
        });

        // Xử lý Đăng xuất
        document.getElementById('btn-logout').addEventListener('click', function() {
            localStorage.removeItem('currentUser');
            dashboardSection.classList.add('d-none');
            loginSection.classList.remove('d-none');
            document.getElementById('form-dang-nhap').reset();
        });

        // Kiểm tra nếu trước đó đã đăng nhập rồi thì giữ nguyên trạng thái
        window.addEventListener('load', function() {
            let currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                loginSection.classList.add('d-none');
                dashboardSection.classList.remove('d-none');
                document.getElementById('welcome-user').innerText = currentUser;
            }
        });
    </script>
</body>
</html>
