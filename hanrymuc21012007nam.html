<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị - HeoDaThanry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- KHUNG ĐĂNG NHẬP ADMIN -->
    <div id="loginOverlay" class="container mt-5" style="max-width: 400px;">
        <div class="card shadow p-4 mt-5">
            <h4 class="text-center mb-3">🔒 Đăng nhập Admin</h4>
            <div class="mb-3">
                <input type="password" id="adminPassword" class="form-control" placeholder="Nhập mật khẩu quản trị...">
            </div>
            <button class="btn btn-primary w-100" onclick="checkPassword()">Truy cập</button>
        </div>
    </div>

    <!-- NỘI DUNG QUẢN TRỊ CHÍNH (ẨN BAN ĐẦU) -->
    <div id="adminContent" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🛡️ Quản Lý Đơn Nạp Tiền - HeoDaThanry</h2>
            <button class="btn btn-outline-secondary btn-sm" onclick="location.reload()">Đăng xuất / Khóa lại</button>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Tài khoản User</th>
                            <th>Số tiền</th>
                            <th>Dung lượng nhận</th>
                            <th>Thời gian</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="pendingOrdersList">
                        <tr><td colspan="6" class="text-center text-muted">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ BẢO MẬT VÀ FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Cấu hình Firebase của dự án bạn
        const firebaseConfig = {
            databaseURL: "YOUR_FIREBASE_DATABASE_URL" // Thay link database Firebase của bạn vào đây
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Kiểm tra mật khẩu Admin
        window.checkPassword = function() {
            const pass = document.getElementById('adminPassword').value;
            // Đặt mật khẩu của bạn ở đây (ví dụ: "nam2007" hoặc mật khẩu bạn thích)
            if (pass === "123456") { 
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadOrders(); // Tải dữ liệu đơn hàng khi đăng nhập thành công
            } else {
                alert("Sai mật khẩu quản trị!");
            }
        };

        // Hàm tải danh sách đơn hàng chờ duyệt
        function loadOrders() {
            const ordersRef = ref(db, 'orders');
            onValue(ordersRef, (snapshot) => {
                const tbody = document.getElementById('pendingOrdersList');
                tbody.innerHTML = '';
                
                if (!snapshot.exists()) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Không có đơn hàng nào đang chờ.</td></tr>';
                    return;
                }

                let hasPending = false;
                snapshot.forEach((childSnapshot) => {
                    const orderId = childSnapshot.key;
                    const order = childSnapshot.val();

                    if (order.status === 'pending') {
                        hasPending = true;
                        let row = `
                            <tr>
                                <td><b>${orderId}</b></td>
                                <td>${order.userEmail || order.username || 'Khách'}</td>
                                <td class="text-danger fw-bold">${Number(order.amount).toLocaleString()} đ</td>
                                <td class="text-success fw-bold">+${order.gb} GB</td>
                                <td>${order.time || 'N/A'}</td>
                                <td>
                                    <button class="btn btn-sm btn-success" onclick="approveOrder('${orderId}', '${order.userId}', ${order.gb})">✔ Duyệt</button>
                                    <button class="btn btn-sm btn-danger" onclick="rejectOrder('${orderId}')">✖ Hủy</button>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    }
                });

                if (!hasPending) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Hiện tại không có đơn hàng nào cần duyệt.</td></tr>';
                }
            });
        }

        // Hàm Duyệt đơn
        window.approveOrder = async function(orderId, userId, gbToAdd) {
            if (!confirm(`Xác nhận duyệt đơn ${orderId} và cộng ${gbToAdd} GB?`)) return;

            try {
                const userRef = ref(db, `users/${userId}`);
                const snapshot = await get(userRef);
                
                let currentGb = 0;
                if (snapshot.exists()) {
                    currentGb = snapshot.val().cloudGb || 0;
                }

                const updates = {};
                updates[`users/${userId}/cloudGb`] = currentGb + gbToAdd;
                updates[`orders/${orderId}/status`] = 'completed';

                await update(ref(db), updates);
                alert("Đã duyệt và cộng GB thành công!");
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Có lỗi xảy ra khi duyệt đơn.");
            }
        };

        // Hàm Hủy đơn
        window.rejectOrder = async function(orderId) {
            if (!confirm("Bạn muốn hủy đơn hàng này?")) return;
            await update(ref(db), {
                [`orders/${orderId}/status`]: 'rejected'
            });
            alert("Đã hủy đơn hàng.");
        };
    </script>
</body>
</html>
