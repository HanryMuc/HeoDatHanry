<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị - Duyệt Nạp Tiền Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">🛡️ Trang Admin - Duyệt Giao Dịch Nạp GB</h2>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Tài khoản User</th>
                            <th>Số tiền</th>
                            <th>Dung lượng nhận</th>
                            <th>Thời gian</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="pendingOrdersList">
                        <!-- Dữ liệu đơn hàng sẽ được load tự động vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Thay cấu hình Firebase của bạn vào đây
        const firebaseConfig = {
            databaseURL: "YOUR_FIREBASE_DATABASE_URL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Lấy danh sách các đơn hàng đang chờ duyệt
        const ordersRef = ref(db, 'orders');
        onValue(ordersRef, (snapshot) => {
            const tbody = document.getElementById('pendingOrdersList');
            tbody.innerHTML = '';
            
            if (!snapshot.exists()) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Không có đơn hàng nào đang chờ.</td></tr>';
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const orderId = childSnapshot.key;
                const order = childSnapshot.val();

                // Chỉ hiển thị đơn có trạng thái "pending" (chờ duyệt)
                if (order.status === 'pending') {
                    let row = `
                        <tr>
                            <td><b>${orderId}</b></td>
                            <td>${order.userEmail || order.username}</td>
                            <td class="text-danger fw-bold">${order.amount.toLocaleString()} đ</td>
                            <td class="text-success fw-bold">+${order.gb} GB</td>
                            <td>${order.time}</td>
                            <td>
                                <button class="btn btn-sm btn-success" onclick="approveOrder('${orderId}', '${order.userId}', ${order.gb})">✔ Duyệt & Cộng GB</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectOrder('${orderId}')">✖ Hủy</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                }
            });
        });

        // Hàm bấm Duyệt đơn hàng
        window.approveOrder = async function(orderId, userId, gbToAdd) {
            if (!confirm(`Bạn có chắc chắn muốn duyệt đơn ${orderId} và cộng ${gbToAdd} GB cho user này không?`)) return;

            try {
                // 1. Lấy thông tin dung lượng hiện tại của user
                const userRef = ref(db, `users/${userId}`);
                const snapshot = await get(userRef);
                
                let currentGb = 0;
                if (snapshot.exists()) {
                    currentGb = snapshot.val().cloudGb || 0;
                }

                // 2. Cập nhật dung lượng mới cho user và đổi trạng thái đơn hàng thành "completed"
                const updates = {};
                updates[`users/${userId}/cloudGb`] = currentGb + gbToAdd;
                updates[`orders/${orderId}/status`] = 'completed';

                await update(ref(db), updates);
                alert("Đã duyệt và cộng GB thành công cho khách!");
            } catch (error) {
                console.error("Lỗi khi duyệt:", error);
                alert("Có lỗi xảy ra, vui lòng thử lại.");
            }
        };

        // Hàm bấm Hủy đơn
        window.rejectOrder = async function(orderId) {
            if (!confirm("Bạn muốn từ chối/hủy đơn hàng này?")) return;
            await update(ref(db), {
                [`orders/${orderId}/status`]: 'rejected'
            });
            alert("Đã từ chối đơn hàng.");
        };
    </script>
</body>
</html>
